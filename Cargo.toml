[package]
name = "edgarkit"
version = "0.2.1"
edition = "2024"
authors = ["Sergey Monin <moninsergei@gmail.com>"]
license = "MIT"
description = "An unofficial Rust client for the SEC EDGAR system"
repository = "https://github.com/r007/edgarkit"
documentation = "https://docs.rs/edgarkit"
keywords = ["sec", "edgar", "finance", "filings", "api"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "README.md"
exclude = [
    "tests/*",
    ".assets/*",
    ".gitignore",
]

[features]
default = ["search", "filings", "company", "feeds", "index"]
search = ["dep:serde_urlencoded", "dep:futures-util"]
filings = ["dep:flate2", "dep:chrono"]
company = ["dep:chrono"]
feeds = ["atom", "rss"]
atom = ["dep:quick-xml"]
rss = ["dep:quick-xml"]
index = ["dep:flate2", "dep:chrono"]
cache = ["dep:moka"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = { version = "0.7.1", optional = true }
quick-xml = { version = "0.40.1", features = ["serialize", "serde"], optional = true }

# HTTP & Async
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "http2", "charset", "macos-system-configuration"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1.89"
futures-util = { version = "0.3.32", optional = true }
governor = { version = "0.10.4", default-features = false, features = ["std"] }

# Error handling
thiserror = "2.0.18"
tracing = "0.1.44"

# Utilities
chrono = { version = "0.4.44", optional = true }
fastrand = "2.4.1"
flate2 = { version = "1.1.9", optional = true }
moka = { version = "0.12", features = ["future"], optional = true }
