[package]
name = "edgarkit"
version = "0.5.0"
edition = "2024"
authors = ["Sergey Monin <moninsergei@gmail.com>"]
license = "MIT"
description = "An unofficial Rust client for the SEC EDGAR system"
repository = "https://github.com/r007/edgarkit"
documentation = "https://docs.rs/edgarkit"
keywords = ["sec", "edgar", "finance", "filings", "api"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "README.md"
exclude = [
    "tests/*",
    ".assets/*",
    ".gitignore",
]

[features]
default = ["search", "filings", "company", "feeds", "index"]
search = ["dep:serde_urlencoded", "dep:futures-util"]
filings = ["dep:flate2", "dep:chrono"]
company = ["dep:chrono"]
feeds = ["atom", "rss"]
atom = ["dep:quick-xml"]
rss = ["dep:quick-xml"]
index = ["dep:flate2", "dep:chrono"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = { version = "0.7.1", optional = true }
quick-xml = { version = "0.42.0", features = ["serialize", "serde"], optional = true }

# HTTP & Async
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "charset", "system-proxy"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1.92"
futures-util = { version = "0.3.34", optional = true }
governor = { version = "0.10.4", default-features = false, features = ["std"] }

# Error handling
thiserror = "2.0.21"
tracing = "0.1.44"

# Utilities
chrono = { version = "0.4.45", optional = true }
fastrand = "2.5.0"
flate2 = { version = "1.1.10", optional = true }

[dev-dependencies]
# The adaptive rate-limit tests stand up a local HTTP server that enforces a
# quota the way EDGAR does, so they need tokio's networking and timers.
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
